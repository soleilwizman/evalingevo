[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-epistasis-mvp"
version = "0.2.0"
description = "Minimal Evo 2 benchmark for human regulatory epistasis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0",
  "scikit-learn==1.8.0", "matplotlib==3.10.8"
]

[project.scripts]
evo-epi = "evo_epistasis:main"

[tool.setuptools]
py-modules = ["evo_epistasis"]
